# v0.8 release gate: typecheck, lint, build and the tests on real Linux and Windows. No secrets, and no actions beyond
# GitHub's own checkout and setup-node, pinned to a commit. Keychain-native tests stay opt-in (AITERM_NATIVE_KEYCHAIN_TEST).
name: test
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # The desktop app isn't built or tested here; its Electron download isn't needed.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: package.json
      # The Linux sandbox tests need bubblewrap and unprivileged user namespaces (Ubuntu 24.04 restricts them by default).
      - name: bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
